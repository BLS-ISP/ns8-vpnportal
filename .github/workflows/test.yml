name: Test & NS8 Audit

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  python-tests:
    name: Python Unit Tests & NS8 Rule Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "container/requirements.txt"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f container/requirements.txt ]; then
            pip install -r container/requirements.txt
          fi
          pip install pytest pytest-asyncio httpx jsonschema pyotp

      - name: Run NS8 Architecture & Rule Audit
        run: python tests/verify_ns8_rules.py

      - name: Run pytest suite
        run: pytest -v

      - name: Validate generated nftables rulesets against Linux kernel nf_tables
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends nftables
          python - <<'PY'
          import subprocess
          from container.app.firewall import build_nft_ruleset

          cases = [
              build_nft_ruleset(
                  module_id="vpnportal1",
                  interface_name="wg-vpnportal1",
                  wg_network="10.199.0.0/24",
                  tunnel_mode="split",
                  allowed_cidrs=["192.168.178.0/24", "192.168.0.0/16"],
                  dns_servers=["192.168.178.10", "192.168.178.11"],
                  nat_enabled=True,
                  ovpn_enabled=True,
                  ovpn_interface_name="tun-vpnportal1",
                  ovpn_network="10.199.1.0/24",
                  s2s_remote_cidrs=["192.168.20.0/24", "10.90.0.0/16"],
              ),
              build_nft_ruleset(
                  module_id="vpnportal1",
                  interface_name="wg-vpnportal1",
                  wg_network="10.199.0.0/24",
                  tunnel_mode="full",
                  allowed_cidrs=[],
                  dns_servers=["9.9.9.9"],
                  nat_enabled=False,
              ),
          ]
          for idx, ruleset in enumerate(cases, 1):
              res = subprocess.run(["sudo", "nft", "-c", "-f", "-"], input=ruleset, text=True, capture_output=True)
              if res.returncode != 0:
                  raise SystemExit(f"nft -c failed on case {idx}:\n{res.stderr}\nRuleset:\n{ruleset}")
              print(f"Kernel nft -c validation passed for case {idx}")
          PY

  cockpit-ui:
    name: Cockpit UI Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "ui/package-lock.json"

      - name: Check Self-Service Portal JavaScript syntax
        run: node --check container/app/portal_static/app.js

      - name: Install UI dependencies
        working-directory: ui
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint UI
        working-directory: ui
        run: npm run lint

      - name: Build UI
        working-directory: ui
        run: npm run build
